global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'ecommerce-gateway'
    static_configs:
      - targets: ['host.docker.internal:9464']
  - job_name: 'ecommerce-user'
    static_configs:
      - targets: ['host.docker.internal:9465']
  - job_name: 'ecommerce-product'
    static_configs:
      - targets: ['host.docker.internal:9466']
  - job_name: 'ecommerce-orders'
    static_configs:
      - targets: ['host.docker.internal:9467']
  - job_name: 'ecommerce-payment'
    static_configs:
      - targets: ['host.docker.internal:9468']
  - job_name: 'ecommerce-notification'
    static_configs:
      - targets: ['host.docker.internal:9469']
  - job_name: 'ecommerce-review'
    static_configs:
      - targets: ['host.docker.internal:9470']
  - job_name: 'ecommerce-promotion'
    static_configs:
      - targets: ['host.docker.internal:9471']
  - job_name: 'ecommerce-inventory'
    static_configs:
      - targets: ['host.docker.internal:9472']
  - job_name: 'ecommerce-shipping'
    static_configs:
      - targets: ['host.docker.internal:9473']

  # Hạ tầng dùng tiền tố `infra-` (không phải `ecommerce-`) để không lẫn vào biến $job của dashboard Server Overview,
  # vốn chỉ dành cho các service Node.js. Exporter chạy trong cùng network compose nên gọi bằng tên service.
  - job_name: 'infra-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: 'infra-redis'
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: 'infra-kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
